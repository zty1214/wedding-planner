name: Check planner
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAIN_FLOW_ARTIFACT_DIR: ${{ runner.temp }}/main-flow-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-flow-e2e
          path: |
            ${{ env.MAIN_FLOW_ARTIFACT_DIR }}/main-flow-e2e-report.json
            ${{ env.MAIN_FLOW_ARTIFACT_DIR }}/main-flow-e2e-*.png
          if-no-files-found: ignore
